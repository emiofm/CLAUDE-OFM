services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator
      POSTGRES_DB: creator_finder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_finder"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: "true"   # set to "false" for a slim image + EMBEDDING_MODEL=debug-color-histogram
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://creator:creator@db:5432/creator_finder
      HF_HOME: /app/data/hf-cache
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  backend-data:
